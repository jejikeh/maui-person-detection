# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Backend

on:
  push:
    branches: ["feature/cicd"]
  pull_request:
    branches: ["feature/cicd"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./Backend/PersonDetection.Backend.Web/PersonDetection.Backend.Web.csproj

      - name: Build
        run: dotnet build ./Backend/PersonDetection.Backend.Web/PersonDetection.Backend.Web.csproj --no-restore

      - name: Restore Neural.Core Tests
        run: dotnet restore ./Neural/tests/Neural.Core.Tests/Neural.Core.Tests.csproj

      - name: Neural.Core Tests
        run: dotnet test ./Neural/tests/Neural.Core.Tests/Neural.Core.Tests.csproj --verbosity detailed

      - name: Restore Neural.Core Tests
        run: dotnet restore ./Neural/tests/Neural.Core.Tests/Neural.Core.Tests.csproj

      - name: Neural.Core Tests
        run: dotnet test ./Neural/tests/Neural.Core.Tests/Neural.Core.Tests.csproj --verbosity detailed

      - name: Restore Neural.Tests.Onnx Tests
        run: dotnet restore ./Neural/tests/Neural.Tests.Onnx/Neural.Tests.Onnx.csproj

      - name: Neural.Tests.Onnx Tests
        run: dotnet test ./Neural/tests/Neural.Tests.Onnx/Neural.Tests.Onnx.csproj --verbosity detailed

      - name: Restore Neural.Defaults.Tests Tests
        run: dotnet restore ./Neural/tests/Neural.Defaults.Tests/Neural.Defaults.Tests.csproj

      - name: Neural.Defaults.Tests Tests
        run: dotnet test ./Neural/tests/Neural.Defaults.Tests/Neural.Defaults.Tests.csproj --verbosity detailed

      - name: Publish
        run: dotnet publish ./Backend/PersonDetection.Backend.Web/PersonDetection.Backend.Web.csproj --no-build
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: jejikeh/person-detection:latest
