name: Angular CI
on:
  push:
    branches: ["feature/cicd"]
  pull_request:
    branches: ["feature/cicd"]
  workflow_dispatch:
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Use Node 21.x
        uses: actions/setup-node@v1
        with:
          node-version: "21.x"
      - name: Install dependencies
        run: npm ci --prefix Frontend/person-detection --force
      - name: Build
        run: npm run build:ci --prefix Frontend/person-detection
      - name: Test
        run: npm run test:ci --prefix Frontend/person-detection

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: jejikeh/person-detection-frontend:latest
